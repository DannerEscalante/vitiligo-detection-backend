version: '3.8'

services:
  vitiligo-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitiligo-container
    # Carga automáticamente las variables del .env para la conexión de base de datos
    env_file:
      - .env
    volumes:
      - /root/uploads:/app/uploads
    # Mantenemos el puerto 8001 expuesto para la compatibilidad móvil actual
    ports:
      - "8001:8000"
    networks:
      - vitiligo-net
    restart: always

  vitiligo-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=/api
    container_name: vitiligo-frontend-container
    expose:
      - "3000"
    networks:
      - vitiligo-net
    restart: always

  vitiligo-nginx:
    image: nginx:alpine
    container_name: vitiligo-nginx
    # Puerto 80 es la entrada única para el panel administrativo web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vitiligo-backend
      - vitiligo-frontend
    networks:
      - vitiligo-net
    restart: always

networks:
  vitiligo-net:
    external: true
